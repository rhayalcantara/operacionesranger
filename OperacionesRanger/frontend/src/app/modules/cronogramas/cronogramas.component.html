<div class="cronogramas-container">
  <div class="header">
    <h1>Gestión de Cronogramas</h1>
    <button mat-raised-button color="primary" (click)="abrirFormularioCrear()">
      <mat-icon>add</mat-icon>
      Nuevo Cronograma
    </button>
  </div>

  <!-- Filtros -->
  <mat-card class="filters-card">
    <mat-card-content>
      <div class="filters-row">
        <!-- Busqueda -->
        <mat-form-field appearance="outline" class="filter-field search-field">
          <mat-label>Buscar</mat-label>
          <input matInput [formControl]="searchControl" placeholder="Nombre o descripción del cronograma">
          <mat-icon matPrefix>search</mat-icon>
          <button mat-icon-button matSuffix *ngIf="searchControl.value" (click)="limpiarBusqueda()">
            <mat-icon>clear</mat-icon>
          </button>
        </mat-form-field>
      </div>
    </mat-card-content>
  </mat-card>

  <!-- Tabla de Cronogramas -->
  <mat-card class="table-card">
    <mat-card-content>
      <div class="table-container">
        <div *ngIf="isLoading()" class="loading-overlay">
          <mat-spinner></mat-spinner>
        </div>

        <table mat-table [dataSource]="dataSource" class="cronogramas-table" *ngIf="!isLoading()">
          <!-- Nombre Column -->
          <ng-container matColumnDef="nombre">
            <th mat-header-cell *matHeaderCellDef>Nombre</th>
            <td mat-cell *matCellDef="let cronograma">{{ cronograma.nombre }}</td>
          </ng-container>

          <!-- Descripcion Column -->
          <ng-container matColumnDef="descripcion">
            <th mat-header-cell *matHeaderCellDef>Descripción</th>
            <td mat-cell *matCellDef="let cronograma">{{ cronograma.descripcion || '—' }}</td>
          </ng-container>

          <!-- Detalles Count Column -->
          <ng-container matColumnDef="detalles_count">
            <th mat-header-cell *matHeaderCellDef>Asignaciones</th>
            <td mat-cell *matCellDef="let cronograma">
              <mat-chip-set>
                <mat-chip>
                  {{ cronograma.detalles_count || 0 }}
                </mat-chip>
              </mat-chip-set>
            </td>
          </ng-container>

          <!-- Activo Column -->
          <ng-container matColumnDef="activo">
            <th mat-header-cell *matHeaderCellDef>Estado</th>
            <td mat-cell *matCellDef="let cronograma">
              <mat-chip-set>
                <mat-chip [highlighted]="cronograma.activo" [class.inactive-chip]="!cronograma.activo">
                  {{ cronograma.activo ? 'Activo' : 'Inactivo' }}
                </mat-chip>
              </mat-chip-set>
            </td>
          </ng-container>

          <!-- Acciones Column -->
          <ng-container matColumnDef="acciones">
            <th mat-header-cell *matHeaderCellDef>Acciones</th>
            <td mat-cell *matCellDef="let cronograma">
              <button mat-icon-button color="primary" (click)="abrirFormularioEditar(cronograma)" matTooltip="Editar">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="warn" (click)="eliminarCronograma(cronograma)" matTooltip="Eliminar">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

          <!-- Empty state -->
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell" [attr.colspan]="displayedColumns.length">
              <div class="empty-state">
                <mat-icon>inbox</mat-icon>
                <p>No se encontraron cronogramas</p>
              </div>
            </td>
          </tr>
        </table>

        <!-- Paginador -->
        <mat-paginator
          [length]="totalCronogramas"
          [pageSize]="pageSize"
          [pageSizeOptions]="[5, 10, 25, 50]"
          [pageIndex]="pageIndex"
          (page)="onPageChange($event)"
          showFirstLastButtons>
        </mat-paginator>
      </div>
    </mat-card-content>
  </mat-card>
</div>
