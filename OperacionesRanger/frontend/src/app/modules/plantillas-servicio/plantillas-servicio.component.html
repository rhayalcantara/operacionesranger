<div class="plantillas-servicio-container">
  <div class="header">
    <h1>Plantillas de Servicio</h1>
    <button mat-raised-button color="primary" (click)="abrirFormularioCrear()">
      <mat-icon>add</mat-icon>
      Nueva Plantilla
    </button>
  </div>

  <!-- Filtros -->
  <mat-card class="filters-card">
    <mat-card-content>
      <div class="filters-row">
        <!-- Busqueda -->
        <mat-form-field appearance="outline" class="filter-field search-field">
          <mat-label>Buscar</mat-label>
          <input matInput [formControl]="searchControl" placeholder="Buscar por nombre o descripción">
          <mat-icon matPrefix>search</mat-icon>
          <button mat-icon-button matSuffix *ngIf="searchControl.value" (click)="limpiarBusqueda()">
            <mat-icon>clear</mat-icon>
          </button>
        </mat-form-field>
      </div>
    </mat-card-content>
  </mat-card>

  <!-- Tabla de Plantillas -->
  <mat-card class="table-card">
    <mat-card-content>
      <div class="table-container">
        <div *ngIf="isLoading()" class="loading-overlay">
          <mat-spinner></mat-spinner>
        </div>

        <div class="table-scroll-wrapper">
          <table mat-table [dataSource]="dataSource" class="plantillas-table" *ngIf="!isLoading()">
            <!-- Nombre Column -->
            <ng-container matColumnDef="nombre">
              <th mat-header-cell *matHeaderCellDef>Nombre</th>
              <td mat-cell *matCellDef="let plantilla">
                <span class="plantilla-nombre">{{ plantilla.nombre }}</span>
              </td>
            </ng-container>

            <!-- Descripcion Column -->
            <ng-container matColumnDef="descripcion">
              <th mat-header-cell *matHeaderCellDef>Descripción</th>
              <td mat-cell *matCellDef="let plantilla">
                <span class="plantilla-descripcion">{{ plantilla.descripcion || '-' }}</span>
              </td>
            </ng-container>

            <!-- Cantidad Detalles Column -->
            <ng-container matColumnDef="cantidad_detalles">
              <th mat-header-cell *matHeaderCellDef>Servicios</th>
              <td mat-cell *matCellDef="let plantilla">
                <mat-chip-set>
                  <mat-chip class="chip-count">
                    {{ plantilla.cantidad_detalles || 0 }}
                  </mat-chip>
                </mat-chip-set>
              </td>
            </ng-container>

            <!-- Activo Column -->
            <ng-container matColumnDef="activo">
              <th mat-header-cell *matHeaderCellDef>Estado</th>
              <td mat-cell *matCellDef="let plantilla">
                <mat-chip-set>
                  <mat-chip [class.chip-activo]="plantilla.activo"
                            [class.chip-inactivo]="!plantilla.activo">
                    {{ plantilla.activo ? 'Activa' : 'Inactiva' }}
                  </mat-chip>
                </mat-chip-set>
              </td>
            </ng-container>

            <!-- Acciones Column -->
            <ng-container matColumnDef="acciones">
              <th mat-header-cell *matHeaderCellDef>Acciones</th>
              <td mat-cell *matCellDef="let plantilla">
                <button mat-icon-button color="primary" (click)="abrirFormularioEditar(plantilla)" matTooltip="Editar">
                  <mat-icon>edit</mat-icon>
                </button>
                <button mat-icon-button color="warn" (click)="eliminarPlantilla(plantilla)" matTooltip="Eliminar">
                  <mat-icon>delete</mat-icon>
                </button>
              </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

            <!-- Empty state -->
            <tr class="mat-row" *matNoDataRow>
              <td class="mat-cell" [attr.colspan]="displayedColumns.length">
                <div class="empty-state">
                  <mat-icon>inbox</mat-icon>
                  <p>No se encontraron plantillas de servicio</p>
                </div>
              </td>
            </tr>
          </table>
        </div>

        <!-- Paginador -->
        <mat-paginator
          [length]="totalPlantillas"
          [pageSize]="pageSize"
          [pageSizeOptions]="[5, 10, 25, 50]"
          [pageIndex]="pageIndex"
          (page)="onPageChange($event)"
          showFirstLastButtons>
        </mat-paginator>
      </div>
    </mat-card-content>
  </mat-card>
</div>
