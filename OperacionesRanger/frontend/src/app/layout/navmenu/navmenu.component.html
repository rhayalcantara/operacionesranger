<mat-nav-list class="nav-menu">
  <!-- Logo / Título de la aplicación (opcional) -->
  <div class="app-logo">
    <mat-icon class="logo-icon">security</mat-icon>
    <h3 class="app-title">Turnos</h3>
  </div>

  <mat-divider></mat-divider>

  <!-- Iteración sobre items de menú visibles -->
  <ng-container *ngFor="let item of visibleMenuItems">
    <!-- Item sin hijos (navegación directa) -->
    <a
      *ngIf="!item.children"
      mat-list-item
      [routerLink]="item.route"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
      class="menu-item"
      (click)="navigateTo(item.route!)"
    >
      <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
      <span matListItemTitle>{{ item.label }}</span>
    </a>

    <!-- Item con hijos (submenu expandible) -->
    <div *ngIf="item.children" class="submenu-container">
      <!-- Item padre (toggle submenu) -->
      <div class="parent-item-wrapper" (click)="toggleSubmenu(item)">
        <mat-list-item
          class="menu-item parent-item"
          [class.has-active-child]="hasActiveChild(item)"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
          <mat-icon class="expand-icon" matListItemMeta>
            {{ item.expanded ? 'expand_less' : 'expand_more' }}
          </mat-icon>
        </mat-list-item>
      </div>

      <!-- Submenu (children) -->
      <div class="submenu">
        <a
          *ngFor="let child of item.children"
          mat-list-item
          [routerLink]="child.route"
          routerLinkActive="active"
          class="menu-item submenu-item"
          (click)="navigateTo(child.route!)"
        >
          <mat-icon matListItemIcon class="child-icon">{{ child.icon }}</mat-icon>
          <span matListItemTitle>{{ child.label }}</span>
        </a>
      </div>
    </div>
  </ng-container>
</mat-nav-list>
